name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: API tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fgh, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: federal_guest_house_test }
        ports: ["5437:5432"]
        options: --health-cmd "pg_isready -U fgh" --health-interval 5s --health-retries 10
      mongo:
        image: mongo:8
        ports: ["27021:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm -w apps/api run db:generate
      - run: npm test
